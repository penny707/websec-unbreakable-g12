name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: Faal bij bevindingen met ernst hoog of kritiek
        run: |
          jq -r '
            .runs[]
            | ( [ (.tool.driver.rules // []), ((.tool.extensions // []) | map(.rules // []) | add // []) ]
                | add | map({key: .id, value: (.properties["security-severity"] // "0" | tonumber)}) | from_entries ) as $sev
            | .results[]
            | select(($sev[.ruleId] // 0) >= 7.0)
            | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"
          ' sarif-results/*.sarif | tee hoog.txt
          test ! -s hoog.txt

  sca:
    name: SCA (Trivy en Retire.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy - alle bevindingen (waarschuwen)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.75.0 \
            fs --scanners vuln --exit-code 0 /src
      - name: Trivy - hoog en kritiek (blokkeren)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.75.0 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignorefile /src/.trivyignore --exit-code 1 /src
      - name: Retire.js - alle bevindingen (waarschuwen)
        run: npx --yes retire@6.1.0 --path app/wwwroot --exitwith 0
      - name: Retire.js - hoog en kritiek (blokkeren)
        run: npx --yes retire@6.1.0 --path app/wwwroot --severity high --exitwith 1
