services:
  bunkerweb:
    image: bunkerity/bunkerweb-all-in-one:1.6.16
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    environment:
      SERVER_NAME: "g12.ipv6.thelastgym.be"
      SERVICE_UI: "no"
      USE_IPV6: "yes"
      CUSTOM_CONF_MODSEC_xuser: |
        SecRule REQUEST_HEADERS:X-User "!@rx ^[A-Za-z0-9._ -]{1,40}$$" "id:1000001,phase:1,deny,status:403,log,msg:'Ongeldige X-User header (virtuele patch SQLi)'"
      AUTO_LETS_ENCRYPT: "yes"
      USE_LETS_ENCRYPT_STAGING: "no"
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_URL: "/"
      REVERSE_PROXY_HOST: "http://app:8080"
    volumes:
      - bw-data:/data
    networks: [dmz, app]
    restart: unless-stopped

  app:
    build: ./app
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=${POSTGRES_PASSWORD}"
    depends_on:
      - db
    networks: [app, data]
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped

networks:
  dmz:
    enable_ipv6: true
  app:
  data:
    internal: true

volumes:
  dbdata:
  bw-data:
